version: '3.8'

services:
  bender-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bender-bot
    restart: unless-stopped
    ports:
      - "3555:3555"  # Porta do webhook
    volumes:
      # Persistência do banco de dados
      - ./database:/app/database
      # Persistência da autenticação do WhatsApp
      - ./assets/auth:/app/assets/auth
      # Persistência de imagens personalizadas
      - ./assets/images:/app/assets/images
      # Logs (opcional)
      - ./logs:/app/assets/temp
    environment:
      - NODE_ENV=production
      - TZ=America/Sao_Paulo
    networks:
      - bender-network

networks:
  bender-network:
    driver: bridge
